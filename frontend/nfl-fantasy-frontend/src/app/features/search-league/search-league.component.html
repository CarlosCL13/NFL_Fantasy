<h2>Buscar ligas</h2>

<!-- Filtros -->
<div class="row mb-3">
  <div class="col-md-6">
    <label><strong>Nombre de liga:</strong></label>
    <input
      type="text"
      class="form-control"
      placeholder="Ej. SuperLiga 2025"
      [(ngModel)]="searchName"
    />
  </div>
  <div class="col-md-4 d-flex align-items-end">
    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        id="activeCheck"
        [(ngModel)]="showOnlyActive"
      />
      <label class="form-check-label" for="activeCheck">Mostrar solo activas</label>
    </div>
  </div>
  <div class="col-md-2 d-flex align-items-end">
    <button class="btn btn-primary w-100" (click)="searchLeagues()" [disabled]="loading">
      {{ loading ? 'Buscando...' : 'Buscar' }}
    </button>
  </div>
</div>

<!-- Resultados -->
<div *ngIf="leagues.length > 0" class="mt-4">
  <h3>Ligas encontradas</h3>
  <ul class="list-group">
    <li
      *ngFor="let l of leagues"
      class="list-group-item d-flex justify-content-between align-items-center"
    >
      <div>
        <strong>{{ l.name }}</strong> — Activa: {{ l.isActive ? 'Sí' : 'No' }}
      </div>
      <button class="btn btn-sm btn-success" (click)="selectLeague(l.leagueId!)">Unirme</button>
    </li>
  </ul>
</div>

<!-- Mensaje si no hay resultados -->
<div *ngIf="hasSearched && leagues.length === 0 && !loading" class="text-muted mt-3">
  No se encontraron ligas con los filtros aplicados.
</div>

<!-- Formulario de unión -->
<div *ngIf="joinForm.leagueId" class="mt-4">
  <h4>Unirse a la liga seleccionada</h4>

  <form (ngSubmit)="joinLeague()" #joinFormRef="ngForm" class="p-3 border rounded bg-light">
    <div class="mb-3">
      <label><strong>Alias:</strong></label>
      <input type="text" class="form-control" [(ngModel)]="joinForm.alias" name="alias" required />
    </div>

    <div class="mb-3">
      <label><strong>Nombre del equipo:</strong></label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="joinForm.teamName"
        name="teamName"
        required
      />
    </div>

    <div class="mb-3">
      <label><strong>Contraseña (si aplica):</strong></label>
      <input type="password" class="form-control" [(ngModel)]="joinForm.password" name="password" />
    </div>

    <div class="d-flex justify-content-end">
      <button type="submit" class="btn btn-success me-2">Confirmar unión</button>
      <button type="button" class="btn btn-secondary" (click)="cancelJoin()">Cancelar</button>
    </div>
  </form>
</div>
